[project]
name = "optional.py"
version = "2.0.0"
description = "An implementation of the Optional object in Python"
license = "MIT"
authors = [
  { name = "Chad Befus", email = "crbefus@gmail.com" },
  { name = "Derek Passen", email = "dpassen1@gmail.com" },
]
readme = "README.md"
keywords = ["optional datatype library"]
requires-python = ">= 3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
  "basedpyright>=1.39.9",
  "coverage>=7.15.2",
  "coveralls>=4.1.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
  "typing-extensions>=4.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optional"]

[tool.pytest.ini_options]
addopts = "--cov=optional"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
